<!DOCTYPE html>
<html><head><base target="_top"><style>body{font:13px Arial,sans-serif;padding:18px;color:#172033}label{display:block;margin:12px 0 5px;font-weight:700;font-size:11px;text-transform:uppercase;color:#667085}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d9dee8;border-radius:5px}button{margin-top:16px;padding:9px 14px;border:0;border-radius:5px;color:#fff;background:#315efb;font-weight:700;cursor:pointer}.hint{color:#667085;font-size:11px;line-height:1.5}</style></head><body><h2>A+ Essay Copilot setup</h2><p class="hint">The bridge URL must be HTTPS and reachable from Google Apps Script. The access token is stored in your Google user properties, not in the sidebar HTML. Never put a model API key here.</p><label>Bridge HTTPS URL</label><input id="url" placeholder="https://copilot.example.com"><label>Bridge access token</label><input id="token" type="password" placeholder="Your bridge token"><button onclick="save()">Save configuration</button><p id="status"></p><script>function save(){google.script.run.withSuccessHandler(function(message){document.getElementById('status').textContent=message;}).withFailureHandler(function(error){document.getElementById('status').textContent=error.message||String(error);}).saveBridgeConfig(document.getElementById('url').value,document.getElementById('token').value);}</script></body></html>
