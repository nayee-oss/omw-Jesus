<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --ink: #172033; --muted: #667085; --line: #d9dee8; --blue: #315efb; --soft: #f5f7fb; --warn: #fff5d7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; color: var(--ink); font: 13px/1.45 Arial, sans-serif; background: #fff; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
    .eyebrow { margin: 3px 0 14px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    label { display: block; margin: 12px 0 5px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px; color: var(--ink); background: #fff; font: inherit; resize: vertical; }
    #question { min-height: 58px; }
    #instruction { min-height: 46px; }
    .context { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: #475467; font-size: 11px; }
    .context strong { color: var(--ink); }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 8px; }
    button { min-height: 32px; cursor: pointer; border: 1px solid #bdc7dc; border-radius: 5px; color: var(--ink); background: #fff; font: 700 11px Arial, sans-serif; }
    button:hover { border-color: var(--blue); background: #f2f5ff; }
    button.active { border-color: var(--blue); color: #fff; background: var(--blue); }
    .send { width: 100%; margin-top: 7px; border-color: var(--blue); color: #fff; background: var(--blue); }
    .send:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 18px; margin: 8px 0; color: var(--muted); font-size: 11px; }
    .status.error { color: #b42318; }
    .response { min-height: 260px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fcfcfd; }
    .response.empty { color: #98a2b3; }
    .output-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .small { font-size: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>A+ Essay Copilot</h1>
  <div class="eyebrow">Think clearly. Defend the argument.</div>

  <label for="question">Essay question</label>
  <textarea id="question" placeholder="Detected from the beginning of the document. Edit if needed."></textarea>

  <label>Context sent to the tutor</label>
  <div id="context" class="context">Loading document context…</div>

  <label>What do you want to do?</label>
  <div class="actions">
    <button data-action="develop">DEVELOP</button>
    <button data-action="challenge">CHALLENGE</button>
    <button data-action="explain">EXPLAIN</button>
    <button data-action="connect">CONNECT</button>
    <button data-action="improve">IMPROVE</button>
    <button data-action="professor">PROFESSOR</button>
  </div>

  <label for="instruction">Your instruction <span class="small">(optional)</span></label>
  <textarea id="instruction" placeholder="e.g. Focus on whether this really answers the question."></textarea>
  <button id="send" class="send">SEND TO COPILOT</button>
  <div id="status" class="status"></div>

  <label>AI response</label>
  <div id="response" class="response empty">Your tutor's response will appear here. Nothing is inserted automatically.</div>
  <div class="output-actions">
    <button id="insert">INSERT AT CURSOR</button>
    <button id="replace">REPLACE SELECTION</button>
    <button id="copy">COPY</button>
  </div>

  <script>
    let selectedAction = 'improve';
    let latestResponse = '';
    const $ = (id) => document.getElementById(id);

    function setStatus(message, error) {
      $('status').textContent = message || '';
      $('status').className = error ? 'status error' : 'status';
    }

    function renderContext(context) {
      $('question').value = context.question || '';
      $('context').innerHTML = '<strong>' + (context.selectionPresent ? 'Selected text' : 'Document context') + '</strong><br>' +
        escapeHtml((context.selectedText || context.currentSection || 'No text found. Add your question and plan in the document.').slice(0, 900));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(char) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]; });
    }

    document.querySelectorAll('[data-action]').forEach(function(button) {
      button.addEventListener('click', function() {
        selectedAction = button.dataset.action;
        document.querySelectorAll('[data-action]').forEach(function(item) { item.classList.toggle('active', item === button); });
      });
    });
    document.querySelector('[data-action="improve"]').classList.add('active');

    function loadContext() {
      google.script.run.withSuccessHandler(renderContext).withFailureHandler(function(error) {
        setStatus(error.message || String(error), true);
      }).getDocumentContext();
    }

    $('send').addEventListener('click', function() {
      $('send').disabled = true;
      setStatus('Reading the plan and challenging the reasoning…');
      google.script.run.withSuccessHandler(function(result) {
        latestResponse = result.response || '';
        $('response').textContent = latestResponse;
        $('response').classList.remove('empty');
        renderContext(result.context);
        setStatus('Analysis complete. Nothing was inserted automatically.');
        $('send').disabled = false;
      }).withFailureHandler(function(error) {
        setStatus(error.message || String(error), true);
        $('send').disabled = false;
      }).analyze(selectedAction, $('instruction').value);
    });

    $('insert').addEventListener('click', function() {
      google.script.run.withSuccessHandler(setStatus).withFailureHandler(function(error) { setStatus(error.message || String(error), true); }).insertAtCursor(latestResponse);
    });
    $('replace').addEventListener('click', function() {
      google.script.run.withSuccessHandler(setStatus).withFailureHandler(function(error) { setStatus(error.message || String(error), true); }).replaceSelection(latestResponse);
    });
    $('copy').addEventListener('click', function() {
      navigator.clipboard.writeText(latestResponse).then(function() { setStatus('Copied.'); }).catch(function() { setStatus('Copy failed. Select the response and copy it manually.', true); });
    });
    loadContext();
  </script>
</body>
</html>
